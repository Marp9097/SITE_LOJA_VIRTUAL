<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="./" class="brand" id="brand"><div class="dot"></div><span>Loja</span></a>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar produtos..." autocomplete="off">
      </div>
      <button class="icon-btn" id="cartBtn" aria-label="Carrinho">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        <span class="badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="container" id="app">
    <section class="hero">
      <div class="hero-card" id="hero">
        <div class="hero-content">
          <h1 id="heroTitle"><span class="skel" style="display:inline-block;width:280px;height:44px"></span></h1>
          <p id="heroSub"></p>
          <a href="#produtos" class="btn">Ver produtos</a>
        </div>
      </div>
    </section>

    <section class="section" id="catSection" hidden>
      <div class="section-head"><div><h2>Categorias</h2><p>Escolha uma categoria para filtrar</p></div></div>
      <div class="cat-cards" id="catCards"></div>
    </section>

    <section class="section" id="produtos">
      <div class="section-head"><div><h2 id="gridTitle">Todos os produtos</h2><p id="gridCount"></p></div></div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid" style="margin-top:14px">
        <div class="skel" style="aspect-ratio:.75"></div><div class="skel" style="aspect-ratio:.75"></div>
        <div class="skel" style="aspect-ratio:.75"></div><div class="skel" style="aspect-ratio:.75"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div><b id="footName">Loja</b><div id="footText"></div></div>
      <div class="socials" id="socials"></div>
    </div>
  </footer>

  <!-- Carrinho -->
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="cart">
    <div class="drawer-head"><h3>Seu carrinho</h3><button class="icon-btn" data-close-cart>✕</button></div>
    <div class="drawer-body" id="cartItems"></div>
    <div class="drawer-foot" id="cartFoot">
      <div id="couponBox"></div>
      <div class="totals" id="cartTotals"></div>
      <button class="btn block" id="checkoutBtn">Finalizar pedido</button>
    </div>
  </aside>

  <!-- Produto -->
  <div class="modal" id="productModal"><div class="modal-box" id="productBox"></div></div>

  <!-- Checkout / pagamento -->
  <div class="modal" id="checkoutModal"><div class="modal-box narrow"><button class="icon-btn modal-close" data-close-modal>✕</button><div class="modal-pad" id="checkoutBox"></div></div></div>

  <a class="fab-wpp" id="wpp" hidden target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9 0-1.4.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
